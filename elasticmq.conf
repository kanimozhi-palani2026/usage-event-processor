include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  usage-events-dlq {
  }
  usage-events {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue {
      name = "usage-events-dlq"
      maxReceiveCount = 3
    }
  }
}