spring:
  datasource:
    url: jdbc:mysql://localhost:3306/usage
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  sqs:
    endpoint: http://localhost:9324   # local ElasticMQ; leave empty on real AWS
    region: us-east-1
    queue-name: usage-events